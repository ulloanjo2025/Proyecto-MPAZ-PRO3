spring.application.name=ms-contenido
server.port=8081

# Base de datos H2 en archivo (carpeta data/): los datos se conservan al apagar el servicio
spring.datasource.url=jdbc:h2:file:./data/contenidodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas solas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la base de datos: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
